<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>☀️날씨☀️</title>
        <link rel="stylesheet" href="/css/index.css">
    </head>
    <body>
       <div class="top">
           
            <div class="search">
               <input class="search-input" type="text" placeholder="지역을 입력해주세요">
               <img src="./img/reading%20glasses.png" alt="">
            </div>
                
            
            <div class="favorites">
                <img src="/img/star.png" alt="즐겨찾기">
            </div>
            
            <div class="setting">
                <img src="/img/hamburger.png" alt="햄버거" class="setting_hamburger">
                <img src="/img/X.png" alt="" class="setting_X">
            </div>
        </div>
        
        <div>
           <div class="setting_open">
                <button>시간 형식</button><br>
                <button>자동 갱신</button><br>
                <button>배경 효과</button><br>
            </div>
            <div class="mode_setting">

                <div> <!-- 시간 형식-->
                   <p>시간 설정</p>
                    <button>12</button>
                    <button>24</button><br>
                    <button>확인</button>
                </div>
                <div> <!-- 자동 갱신 -->
                    <input type="text" placeholder="자동 갱신 시간을 정해주세요">
                    <button>확인</button>
                </div>
                <div> <!-- 배경 효과 -->
                   <p>배경 효과</p>
                    <button>on</button>
                    <button>off</button><br>
                    <button>확인</button>
                </div>
                
            </div>
        </div>
        
        <div class="left">
            <div class="temperature">
                <!-- 기온 -->
                
            </div>
            
            <div class="location">
                <!-- 위치 -->
                
            </div>
            
            <div class="weather">
                <!-- 날씨 -->
                
            </div>
            
            <div class="comment">
                <!-- 댓글(맨트) -->
                
            </div>
            
            <div class="time">
                <!-- 시간 -->
                
            </div>
            
            <div class="date">
                <!-- 날짜 -->
                
            </div>
        </div>
        
        <div class="right">
            <div class="hourly_forecast">
                <div class="now">
                    
                </div>
                
                <div class="hour">
                    
                </div>
            </div>
            
            <div class="day5_forecast">
                <div class="day1">
                    
                </div>
                
                <div class="day2">
                    
                </div>
                
                <div class="day3">
                    
                </div>
                
                <div class="day4">
                    
                </div>
                
                <div class="day5">
                    
                </div>
            </div>
        </div>
        <script type="text/javascript" src="js/index.js"></script>
    </body>
</html>
